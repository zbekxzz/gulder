# Локальный стек Gulder: `make dev`, затем `make seed`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gulder
      POSTGRES_PASSWORD: gulder
      POSTGRES_DB: gulder
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulder -d gulder"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Миграции — отдельный шаг перед запуском API (§18.6)
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://gulder:gulder@postgres:5432/gulder?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["/app/api"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgres://gulder:gulder@postgres:5432/gulder?sslmode=disable
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: http://localhost:5173
      DATA_DIR: /app/data
    ports:
      - "8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
