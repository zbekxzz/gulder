# Прод на одном хосте (§18.6): Caddy (TLS) → статика + API; PostgreSQL без публикации порта.
# Запуск: см. docs/runbook.md. Секреты — только в .env на хосте.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gulder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gulder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulder -d gulder"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Миграции — отдельный шаг перед запуском новой версии (§18.6): docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: gulder-backend:${VERSION:-latest}
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://gulder:${POSTGRES_PASSWORD}@postgres:5432/gulder?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["migrate"]

  backend:
    image: gulder-backend:${VERSION:-latest}
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    command: ["/app/api"]
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://gulder:${POSTGRES_PASSWORD}@postgres:5432/gulder?sslmode=disable
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      # X-Forwarded-For принимается только от Caddy из сети compose (лимиты по IP)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes) in .env}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      DATA_DIR: /app/data
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build: { context: ./frontend, target: prod }
    image: gulder-web:${VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
